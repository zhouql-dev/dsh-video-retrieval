name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build host half
        run: node build.mjs
      - name: Smoke test (host + client halves)
        run: node scripts/smoke.mjs
