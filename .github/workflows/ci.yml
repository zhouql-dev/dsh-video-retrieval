name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build host half
        run: node build.mjs
      - name: Smoke test (host + client halves)
        run: node scripts/smoke.mjs

  py-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core-lite deps (no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
      - name: Compile
        run: python -m compileall -q server engine
      - name: Import smoke
        run: |
          python - <<'PY'
          import sys
          sys.path[:0] = ["server", "server/agent", "server/bench"]
          import config, provider, router, scorer, signals, ground, scheduler  # noqa: F401
          import metrics  # noqa: F401
          print("imports ok")
          PY

  py-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
      - name: Unit tests (no model / no GPU)
        run: python tests/run_all.py

  no-hardcoded-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No absolute home paths in source
        run: |
          if grep -rn '/Users/' --include='*.py' server engine | grep -v '/tests/'; then
            echo "FAIL 源码里出现写死的家目录路径"; exit 1
          fi
          echo "PASS 无硬编码家目录"
