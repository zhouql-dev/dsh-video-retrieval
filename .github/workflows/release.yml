name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build host half
        run: node build.mjs
      - name: Smoke test
        run: node scripts/smoke.mjs
      - name: Package built dist
        run: |
          mkdir -p /tmp/pkg
          tar -czf /tmp/pkg/dsh-video-retrieval-dist.tar.gz dist/ dist-client/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/pkg/dsh-video-retrieval-dist.tar.gz
          generate_release_notes: true
