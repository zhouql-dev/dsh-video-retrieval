name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python import smoke
        run: |
          python -m compileall -q packages/vr-backend/vr_backend
      - name: Build host half
        run: node packages/vr-plugin/build.mjs
      - name: Smoke test
        run: node scripts/smoke.mjs
      - name: Python unit tests
        run: |
          pip install fastapi uvicorn numpy scipy opencv-python-headless requests httpx pydantic
          python tests/run_all.py
      - name: Package built dist
        run: |
          mkdir -p /tmp/pkg
          tar -czf /tmp/pkg/dsh-video-retrieval-dist.tar.gz packages/vr-plugin/dist/ packages/vr-plugin/dist-client/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/pkg/dsh-video-retrieval-dist.tar.gz
          generate_release_notes: true
